    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",

        "url": "https://hf-analyzer.devanghacks.in/",
        "description": "Analyses a HuggingFace or GitHub access token in the browser and reports what it can reach: its permissions, the organizations it touches and the repositories it can change.",

        ]
      }
    </script>

    <!--
      Resolve the theme before first paint. Without this the dark class lands in a
      React effect and dark-mode users get a white flash on every load.
    -->
    <script>
      (function () {
        var t;
        try {
          t = localStorage.getItem('theme');
        } catch (e) {
          /* private mode or blocked storage */
        }
        if (t !== 'light' && t !== 'dark') {
          t =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>

    <!-- Anonymous page-view counts. Never receives the token. -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
