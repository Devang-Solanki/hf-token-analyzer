<!--
  Source for public/og.png, the 1200x630 image social platforms show when the
  site is shared. It is a page rather than an image file so it stays in the
  project's own type and colour tokens; keep the values below in sync with
  src/index.css if those change.

  To regenerate, from the repository root:

    python3 -m http.server 8080 &
    chrome --headless=new --disable-gpu --hide-scrollbars \
      --force-color-profile=srgb --window-size=1200,630 \
      --screenshot=public/og.png --virtual-time-budget=8000 \
      http://localhost:8080/assets/og-template.html

  Any Chrome or Chromium binary works. The window size is the output size, so
  do not change it without also updating og:image:width / og:image:height in
  index.html. The footer carries the domain, so it needs a re-render whenever
  the canonical URL changes.
-->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#12161a; --card:#181d22; --ink:#eceff0; --soft:#97a3a8; --rule:#2a3238;
    --contained:#5fbf9e; --elevated:#e0a93c; --breach:#f4826f; --total:#c0a2f5;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:var(--paper);color:var(--ink);
       font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;
       justify-content:space-between;padding:64px 72px;overflow:hidden}
  .top{display:flex;align-items:center;gap:12px}
  .top img{width:34px;height:auto}
  .top span{font-size:20px;font-weight:500;letter-spacing:-.01em}
  h1{font-size:72px;font-weight:700;line-height:1.02;letter-spacing:-.03em;max-width:11ch}
  p{margin-top:22px;font-size:24px;line-height:1.45;color:var(--soft);max-width:26ch}
  .ramp{display:flex;flex-direction:column;gap:2px;margin-top:40px;width:452px;flex:none}
  .row{display:flex;align-items:baseline;gap:14px;background:var(--card);
       padding:11px 18px;border-left:4px solid var(--sev)}
  .name{font-size:18px;font-weight:500;color:var(--sev);min-width:122px}
  .what{font-size:18px;color:var(--soft);white-space:nowrap}
  .foot{display:flex;align-items:center;justify-content:space-between;
        border-top:1px solid var(--rule);padding-top:22px}
  .foot .url{font-family:'IBM Plex Mono',monospace;font-size:19px;color:var(--soft)}
  .foot .tag{font-size:19px;color:var(--soft)}
  .body{display:flex;justify-content:space-between;align-items:flex-start;gap:56px}
</style></head>
<body>
  <div class="top"><img src="../public/logo.png" alt=""><span>Token Analyzer</span></div>

  <div class="body">
    <div>
      <h1>What can this token do?</h1>
      <p>Permissions, organizations and writable repositories &mdash; read in your browser.</p>
    </div>
    <div class="ramp">
      <div class="row" style="--sev:var(--contained)"><span class="name">Read-only</span><span class="what">downloads only</span></div>
      <div class="row" style="--sev:var(--contained)"><span class="name">Scoped</span><span class="what">named resources</span></div>
      <div class="row" style="--sev:var(--elevated)"><span class="name">Write</span><span class="what">changes what you own</span></div>
      <div class="row" style="--sev:var(--total)"><span class="name">Admin</span><span class="what">deletes and administers</span></div>
    </div>
  </div>

  <div class="foot">
    <span class="tag">HuggingFace and GitHub access tokens</span>
    <span class="url">hf-analyzer.devanghacks.in</span>
  </div>
</body></html>
